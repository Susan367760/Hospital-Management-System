{% extends "base.html" %}
{% block title %}Delete patient | CarePoint{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm mx-auto confirm-card"><div class="card-body p-4">
    <div class="text-danger mb-2">Confirm deletion</div><h1 class="h3">Delete {{ patient.full_name }}?</h1>
    <p class="text-muted">You are about to delete demo record <strong>{{ patient.patient_number }}</strong>. This action cannot be undone.</p>
    <form method="post">{% csrf_token %}<div class="d-flex gap-2"><button class="btn btn-danger" type="submit">Yes, delete record</button><a class="btn btn-outline-secondary" href="{% url 'patient_detail' patient.pk %}">Cancel</a></div></form>
</div></div>
{% endblock %}
